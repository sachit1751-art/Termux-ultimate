<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Termux Ultimate banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11111b"/>
      <stop offset="1" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <text x="600" y="140" font-family="Menlo, Consolas, monospace" font-size="58" font-weight="bold" fill="url(#title)" text-anchor="middle">Termux Ultimate</text>
  <text x="600" y="185" font-family="Menlo, Consolas, monospace" font-size="22" fill="#a9b1d6" text-anchor="middle">Transform Termux into a modern AI-powered development environment</text>
  <text x="600" y="225" font-family="Menlo, Consolas, monospace" font-size="18" fill="#6c7086" text-anchor="middle">One command. Seven modules. Zero hassle.</text>
