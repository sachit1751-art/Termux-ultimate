name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Syntax check and shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check and lint all scripts
        run: |
          set -e
          git diff --check
          if git grep -Il $'\r' -- '*.sh' '*.conf' '*.yml'; then
            echo "CRLF line endings detected"
            exit 1
          fi
          for f in tu install.sh uninstall.sh tests/*.sh modules/*.sh modules/shell/*.sh; do
            echo "== $f =="
            bash -n "$f"
            shellcheck -s bash -S warning "$f"
          done
          bash tests/test.sh
          echo "All scripts passed."